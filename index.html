<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3d7ff5">
<meta name="description" content="上傳羽球拍照片，直接模擬換拍線顏色與握把布配色，所有處理都在瀏覽器內完成，照片不會上傳。">
<meta property="og:type" content="website">
<meta property="og:title" content="羽球拍配色模擬器">
<meta property="og:description" content="上傳球拍照片，模擬換線與換握把布的配色。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='11' rx='8' ry='10' fill='none' stroke='%233d7ff5' stroke-width='2.5'/%3E%3Crect x='14.6' y='20' width='2.8' height='11' rx='1.4' fill='%23ff5fa2'/%3E%3C/svg%3E">
<title>羽球拍配色模擬器</title>
<style>
  :root{ --bg:#f6f6f4; --card:#fff; --line:#e2e0da; --text:#26251f; --sub:#6d6b63; --accent:#3d7ff5; --r:10px; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#1b1a18; --card:#242320; --line:#3a3833; --text:#eceae4; --sub:#a3a099; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  .wrap{ max-width:1180px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(320px,390px); gap:16px; }
  @media (max-width:920px){
    .wrap{ grid-template-columns:1fr; gap:10px; padding:10px; }
    .preview{ position:sticky; top:0; z-index:5; background:var(--bg); padding-top:6px; margin:0 -10px; padding-left:10px; padding-right:10px; }
    .preview .card{ padding:8px; border-radius:10px; }
    canvas{ max-height:40vh; }
    h1{ font-size:16px; } .hint{ margin-bottom:8px; }
    .bar{ flex-wrap:nowrap; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
    .bar button{ flex:0 0 auto; }
    .row{ margin:12px 0; }
    .row>label{ flex:0 0 66px; }
    input[type=range]{ height:30px; }
    input[type=number]{ flex:0 0 60px; width:60px; padding:7px 6px; font-size:13px; }
    input[type=color]{ height:34px; flex:0 0 52px; }
    .sw{ margin-left:74px; gap:8px; }
    .sw i{ width:30px; height:30px; }
    button{ padding:9px 14px; }
    .tabs button{ padding:11px; }
  }
  @media (hover:none){ .sw i:hover{ transform:none; } }
  h1{ font-size:17px; font-weight:600; margin:0 0 2px; }
  .hint{ color:var(--sub); font-size:12.5px; margin:0 0 12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stage{ position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden; min-height:220px;
    display:flex; align-items:center; justify-content:center; background:repeating-conic-gradient(#00000008 0 25%,transparent 0 50%) 0 0/18px 18px; }
  canvas{ display:block; max-width:100%; height:auto; touch-action:none;
    max-height:min(640px,72vh); transform-origin:center center; will-change:transform; }
  .stage{ overscroll-behavior:contain; }
  .vhint{ position:absolute; right:8px; bottom:8px; font-size:11px; color:var(--sub);
    background:var(--card); border:1px solid var(--line); border-radius:6px; padding:2px 7px; opacity:.85; pointer-events:none; }
  #drop{ padding:44px 18px; text-align:center; color:var(--sub); }
  #drop b{ color:var(--text); }
  .row{ display:flex; align-items:center; gap:8px; margin:8px 0; }
  .row>label{ flex:0 0 76px; color:var(--sub); font-size:12.5px; }
  .row input[type=range]{ flex:1; min-width:0; accent-color:var(--accent); }
  input[type=number]{ flex:0 0 56px; width:56px; font:inherit; font-size:12.5px; padding:4px 6px; text-align:right;
    border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); }
  button{ font:inherit; color:var(--text); background:transparent; border:1px solid var(--line); border-radius:var(--r); padding:7px 12px; cursor:pointer; }
  button:hover{ background:#8881120f; }
  button.on{ border-color:var(--accent); color:var(--accent); }
  button:disabled{ opacity:.35; cursor:default; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .tabs button{ flex:1; }
  .sw{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 10px 84px; }
  .sw i{ width:22px; height:22px; border-radius:6px; border:1px solid var(--line); cursor:pointer; display:block; }
  .sw i:hover{ transform:scale(1.12); }
  input[type=color]{ flex:0 0 46px; height:28px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; cursor:pointer; }
  select{ font:inherit; font-size:13px; padding:6px 8px; border-radius:var(--r); border:1px solid var(--line); background:var(--card); color:var(--text); }
  .sec{ border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
  .tip{ font-size:12px; color:var(--sub); margin:0 0 8px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .tg{ font-size:12px; color:var(--sub); font-weight:400; display:flex; align-items:center; gap:5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="preview">
    <h1>羽球拍配色模擬器</h1>
    <p class="hint">拍面預設在上方、握把預設在下方置中，對齊後直接換色。照片只在你的瀏覽器裡處理，不會上傳到任何伺服器。</p>
    <div class="card">
      <div class="stage" id="stage">
        <div id="drop">
          <p><b>把球拍照片拖進來</b>，或</p>
          <button class="primary" id="pick">選擇圖片</button>
          <p style="margin-top:10px;font-size:12px">整支直立、置中的照片最好對位</p>
        </div>
        <canvas id="cv" hidden></canvas>
        <span class="vhint" id="vhint" hidden>雙指縮放 / 滾輪縮放</span>
      </div>
      <div class="bar">
        <button id="pick2" hidden>換一張圖</button>
        <button id="undo" hidden>復原</button>
        <button id="redo" hidden>重做</button>
        <button id="fit" hidden>還原檢視</button>
        <button id="home" hidden>重設位置</button>
        <button id="savep" hidden>存成預設</button>
        <button id="clrp" hidden>清除預設</button>
        <button id="save" hidden>下載 PNG</button>
        <button id="reset" hidden>重設顏色</button>
        <span id="stat" style="font-size:12px;color:var(--sub)"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tabString" class="on">拍線</button>
      <button id="tabGrip">握把布</button>
    </div>

    <div id="panelString">
      <p class="tip">滑鼠移到圖上會出現定位框，可直接拖曳微調。</p>
      <div class="row"><label>主線</label><input type="color" id="cMain"><span class="tg" style="flex:1"><input type="checkbox" id="sSplit">橫線分色</span></div>
      <div class="sw" id="swMain"></div>
      <div id="crossWrap" hidden>
        <div class="row"><label>橫線</label><input type="color" id="cCross"><span style="flex:1"></span></div>
        <div class="sw" id="swCross"></div>
      </div>
      <div class="row"><label>線徑</label><input type="range" id="sW" min="0.6" max="8" step="0.1"><input type="number" id="nW" step="0.1"></div>
      <div class="row"><label>主線數</label><input type="range" id="sMainN" min="8" max="34" step="1"><input type="number" id="nMainN"></div>
      <div class="row"><label>橫線數</label><input type="range" id="sCrossN" min="8" max="34" step="1"><input type="number" id="nCrossN"></div>
      <div class="row"><label>淡化原線</label><input type="range" id="sFade" min="0" max="100" step="1"><input type="number" id="nFade"></div>
      <div class="bar">
        <button id="sOn" class="on">顯示拍線</button>
        <button id="sWeave" class="on">交織效果</button>
        <button id="sMore">進階</button>
      </div>
      <div id="moreS" hidden>
        <div class="row"><label>中心 X</label><input type="range" id="sCx" min="0" max="100" step="1"><input type="number" id="nCx"></div>
        <div class="row"><label>中心 Y</label><input type="range" id="sCy" min="0" max="100" step="1"><input type="number" id="nCy"></div>
        <div class="row"><label>寬度</label><input type="range" id="sRx" min="10" max="800" step="1"><input type="number" id="nRx"></div>
        <div class="row"><label>高度</label><input type="range" id="sRy" min="10" max="900" step="1"><input type="number" id="nRy"></div>
        <div class="row"><label>角度</label><input type="range" id="sRot" min="-180" max="180" step="1"><input type="number" id="nRot"></div>
        <div class="row"><label>立體感</label><input type="range" id="sDepth" min="0" max="100" step="1"><input type="number" id="nDepth"></div>
        <div class="row"><label>投影</label><input type="range" id="sSh" min="0" max="100" step="1"><input type="number" id="nSh"></div>
        <div class="row"><label>不透明</label><input type="range" id="sSA" min="10" max="100" step="1"><input type="number" id="nSA"></div>
      </div>
    </div>

    <div id="panelGrip" hidden>
      <p class="tip">滑鼠移到圖上會出現兩個定位點，上面放握把最上緣、下面放底端，尾端凸起會自動接在後面。</p>
      <div class="row"><label>主色</label><input type="color" id="cGrip"><span class="tg" style="flex:1"><input type="checkbox" id="gStripe">雙色交替</span></div>
      <div class="sw" id="swGrip"></div>
      <div id="stripeWrap" hidden>
        <div class="row"><label>第二色</label><input type="color" id="cGrip2"><span style="flex:1"></span></div>
        <div class="sw" id="swGrip2"></div>
      </div>
      <div class="row"><label>寬度</label><input type="range" id="gW" min="6" max="300" step="1"><input type="number" id="nGW"></div>
      <div class="row"><label>材質</label>
        <select id="gTex" style="flex:1">
          <option value="pu">PU 平滑</option>
          <option value="perf">PU 打孔</option>
          <option value="towel">毛巾布</option>
        </select>
      </div>
      <div class="bar">
        <button id="gOn" class="on">顯示握把布</button>
        <button id="gDir">右手纏法</button>
        <button id="gLab">顯示標註</button>
        <button id="gMore">進階</button>
      </div>
      <div id="moreG" hidden>
        <div class="row"><label>纏繞圈數</label><input type="range" id="gT" min="5" max="45" step="1"><input type="number" id="nGT"></div>
        <div class="row"><label>質感強度</label><input type="range" id="gRel" min="0" max="150" step="1"><input type="number" id="nRel"></div>
        <div class="row"><label>八角稜線</label><input type="range" id="gHex" min="0" max="100" step="1"><input type="number" id="nHex"></div>
        <div class="row"><label>上端收窄</label><input type="range" id="gTp" min="50" max="100" step="1"><input type="number" id="nTp"></div>
        <div class="row"><label>收窄長度</label><input type="range" id="gTL" min="3" max="45" step="1"><input type="number" id="nTL"></div>
        <div class="row"><label>底蓋凸起</label><input type="range" id="gFl" min="0" max="120" step="1"><input type="number" id="nFl"></div>
        <div class="row"><label>邊緣陰影</label><input type="range" id="gSd" min="0" max="100" step="1"><input type="number" id="nSd"></div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>

<script>
(function(){
  function g(id){ return document.getElementById(id); }
  var stage=g('stage'), drop=g('drop'), cv=g('cv'), ctx=cv.getContext('2d'), file=g('file');
  var img=null,W=0,H=0,tab='string',hover=false,drag=null,last=null,exporting=false;

  var S={on:true,weave:true,cx:0,cy:0,rx:0,ry:0,rot:0,fade:35,main:'#ff2f6d',cross:'#ff2f6d',split:false,
         mainN:22,crossN:22,w:2.4,depth:70,shadow:30,alpha:100};
  var G={labels:false,on:true,x1:0,y1:0,x2:0,y2:0,w:40,turns:12,autoT:false,dir:1,tex:'pu',rel:120,hex:60,flare:38,sd:100,
         taper:78,tlen:9,color:'#ff5fa2',color2:'#ffffff',stripe:false};

  var SC=['#ffffff','#ededed','#111111','#ffe234','#d9ff3d','#ff2f6d','#ff3b30','#ff7a1a','#e8a33d','#0a84ff','#1e3a8a','#00c2a8','#2fbf3b','#8b5cf6'];
  var GC=['#ffffff','#f2f2f2','#1c1c1e','#e0403c','#f0954a','#ff7a1a','#7ee06a','#2fbf3b','#0a84ff','#1e3a8a','#ff5fa2','#8b5cf6'];

  function hx(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
  function mixArr(c,a){ var f=a<0?0:255,t=Math.abs(a);
    return [c[0]+(f-c[0])*t,c[1]+(f-c[1])*t,c[2]+(f-c[2])*t]; }
  function shade(h,a){ var c=mixArr(hx(h),a); return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'; }
  function k(){ return W/800; }

  function sw(el,list,fn){ list.forEach(function(c){ var i=document.createElement('i');
    i.style.background=c; i.title=c; i.onclick=function(){ fn(c); }; el.appendChild(i); }); }
  sw(g('swMain'),SC,function(c){ S.main=c; g('cMain').value=c; if(!S.split){S.cross=c;g('cCross').value=c;} render(); });
  sw(g('swCross'),SC,function(c){ S.cross=c; g('cCross').value=c; render(); });
  sw(g('swGrip'),GC,function(c){ G.color=c; g('cGrip').value=c; render(); });
  sw(g('swGrip2'),GC,function(c){ G.color2=c; g('cGrip2').value=c; render(); });

  var links=[];
  function link(rid,nid,get,set,dec,after){
    var r=g(rid),n=g(nid); n.min=r.min; n.max=r.max; n.step=r.step;
    function push(v){ v=+v; if(isNaN(v))return; v=Math.max(+r.min,Math.min(+r.max,v));
      set(v); r.value=v; n.value=dec?v.toFixed(dec):Math.round(v); if(after)after(); render(); }
    r.addEventListener('input',function(){ push(r.value); });
    n.addEventListener('change',function(){ push(n.value); });
    n.addEventListener('input',function(){ if(n.value===''){return;} var v=+n.value;
      if(!isNaN(v)&&v>=+r.min&&v<=+r.max){ set(v); r.value=v; if(after)after(); render(); } });
    var o={sync:function(){ var v=get(); r.value=v; n.value=dec?(+v).toFixed(dec):Math.round(v); }};
    links.push(o); return o;
  }
  function syncAll(){ links.forEach(function(o){ o.sync(); }); }

  function syncUI(){
    syncAll();
    g('cMain').value=S.main; g('cCross').value=S.cross;
    g('cGrip').value=G.color; g('cGrip2').value=G.color2;
    g('sSplit').checked=S.split; g('crossWrap').hidden=!S.split;
    g('gStripe').checked=G.stripe; g('stripeWrap').hidden=!G.stripe;
    g('gTex').value=G.tex;
    g('sOn').classList.toggle('on',S.on); g('sOn').textContent=S.on?'顯示拍線':'已隱藏拍線';
    g('sWeave').classList.toggle('on',S.weave);
    dirLabel(); g('gLab').classList.toggle('on',G.labels);
    g('gOn').classList.toggle('on',G.on); g('gOn').textContent=G.on?'顯示握把布':'已隱藏握把布';
  }

  var CS=['fade','main','cross','split','mainN','crossN','w','depth','shadow','alpha','weave','on'];
  var CG=['color','color2','stripe','tex','rel','hex','sd','taper','tlen','flare','dir','labels','on','turns','autoT'];
  function saveCfg(){
    try{ var o={s:{},g:{}};
      CS.forEach(function(x){ o.s[x]=S[x]; }); CG.forEach(function(x){ o.g[x]=G[x]; });
      localStorage.setItem('racketSim',JSON.stringify(o));
    }catch(e){}
  }
  function loadCfg(){
    try{ var v=localStorage.getItem('racketSim'); if(!v) return; var o=JSON.parse(v);
      if(o.s) CS.forEach(function(x){ if(o.s[x]!==undefined) S[x]=o.s[x]; });
      if(o.g) CG.forEach(function(x){ if(o.g[x]!==undefined) G[x]=o.g[x]; });
    }catch(e){}
  }

  var hist=[],hi=-1,htmr=null,busy=false;
  function stateStr(){ return JSON.stringify({S:S,G:G}); }
  function updHist(){ g('undo').disabled=(hi<=0); g('redo').disabled=(hi>=hist.length-1); }
  function applyState(st){
    var o=JSON.parse(st),x;
    for(x in o.S) S[x]=o.S[x];
    for(x in o.G) G[x]=o.G[x];
    busy=true; syncUI(); render(); busy=false;
    updHist(); saveCfg();
  }
  function resetHist(){ hist=[stateStr()]; hi=0; updHist(); }
  function snap(){
    if(busy||!img) return;
    clearTimeout(htmr);
    htmr=setTimeout(function(){
      var st=stateStr();
      if(hist[hi]===st) return;
      hist=hist.slice(0,hi+1); hist.push(st); hi=hist.length-1;
      if(hist.length>60){ hist.shift(); hi--; }
      updHist(); saveCfg();
    },320);
  }

  link('sCx','nCx',function(){return S.cx;},function(v){S.cx=v;});
  link('sCy','nCy',function(){return S.cy;},function(v){S.cy=v;});
  link('sRx','nRx',function(){return S.rx;},function(v){S.rx=v;});
  link('sRy','nRy',function(){return S.ry;},function(v){S.ry=v;});
  link('sRot','nRot',function(){return S.rot;},function(v){S.rot=v;});
  link('sFade','nFade',function(){return S.fade;},function(v){S.fade=v;});
  link('sMainN','nMainN',function(){return S.mainN;},function(v){S.mainN=Math.round(v);});
  link('sCrossN','nCrossN',function(){return S.crossN;},function(v){S.crossN=Math.round(v);});
  link('sW','nW',function(){return S.w;},function(v){S.w=v;},1);
  link('sDepth','nDepth',function(){return S.depth;},function(v){S.depth=v;});
  link('sSh','nSh',function(){return S.shadow;},function(v){S.shadow=v;});
  link('sSA','nSA',function(){return S.alpha;},function(v){S.alpha=v;});
  link('gW','nGW',function(){return G.w;},function(v){G.w=v;},0,function(){ autoTurns(); });
  link('gT','nGT',function(){return G.turns;},function(v){G.turns=Math.round(v); G.autoT=false;});
  link('gRel','nRel',function(){return G.rel;},function(v){G.rel=v;});
  link('gHex','nHex',function(){return G.hex;},function(v){G.hex=v;});
  link('gTp','nTp',function(){return G.taper;},function(v){G.taper=v;});
  link('gTL','nTL',function(){return G.tlen;},function(v){G.tlen=v;});
  link('gFl','nFl',function(){return G.flare;},function(v){G.flare=v;});
  link('gSd','nSd',function(){return G.sd;},function(v){G.sd=v;});

  function bindColor(id,set){ g(id).addEventListener('input',function(){ set(this.value); render(); }); }
  bindColor('cMain',function(v){ S.main=v; if(!S.split){ S.cross=v; g('cCross').value=v; } });
  bindColor('cCross',function(v){ S.cross=v; });
  bindColor('cGrip',function(v){ G.color=v; });
  bindColor('cGrip2',function(v){ G.color2=v; });
  g('sSplit').onchange=function(){ S.split=this.checked; g('crossWrap').hidden=!this.checked;
    if(!this.checked){ S.cross=S.main; g('cCross').value=S.main; } render(); };
  g('gStripe').onchange=function(){ G.stripe=this.checked; g('stripeWrap').hidden=!this.checked; render(); };
  g('gTex').onchange=function(){ G.tex=this.value; render(); };
  g('gLab').onclick=function(){ G.labels=!G.labels; this.classList.toggle('on',G.labels); render(); };
  function dirLabel(){ g('gDir').textContent=(G.dir>0?'右手纏法':'左手纏法'); }
  g('gDir').onclick=function(){ G.dir=-G.dir; dirLabel(); render(); };
  g('sMore').onclick=function(){ var m=g('moreS'); m.hidden=!m.hidden; this.classList.toggle('on',!m.hidden); };
  g('gMore').onclick=function(){ var m=g('moreG'); m.hidden=!m.hidden; this.classList.toggle('on',!m.hidden); };
  g('sOn').onclick=function(){ S.on=!S.on; this.classList.toggle('on',S.on); this.textContent=S.on?'顯示拍線':'已隱藏拍線'; render(); };
  g('sWeave').onclick=function(){ S.weave=!S.weave; this.classList.toggle('on',S.weave); render(); };
  g('gOn').onclick=function(){ G.on=!G.on; this.classList.toggle('on',G.on); this.textContent=G.on?'顯示握把布':'已隱藏握把布'; render(); };

  function autoTurns(){
    if(!G.autoT) return;
    var L=Math.hypot(G.x2-G.x1,G.y2-G.y1);
    if(L<10||G.w<6) return;
    G.turns=Math.max(5,Math.min(45,Math.round(L/(0.31*G.w))));
  }

  var preset=null;
  function loadPreset(){ try{ var v=localStorage.getItem('racketSimPos'); if(v) preset=JSON.parse(v); }catch(e){} }
  function savePreset(){
    if(!img) return;
    preset={cx:S.cx/W,cy:S.cy/H,rx:S.rx/W,ry:S.ry/H,rot:S.rot,
            gx1:G.x1/W,gy1:G.y1/H,gx2:G.x2/W,gy2:G.y2/H,gw:G.w/W};
    try{ localStorage.setItem('racketSimPos',JSON.stringify(preset)); }catch(e){}
    saveCfg(); flash('已存成預設');
  }
  function clearPreset(){
    preset=null; try{ localStorage.removeItem('racketSimPos'); localStorage.removeItem('racketSim'); }catch(e){}
    flash('已清除預設');
  }
  var ftmr=null;
  function flash(t){
    clearTimeout(ftmr); g('stat').textContent=t;
    ftmr=setTimeout(function(){ g('stat').textContent='圖片 '+W+' × '+H; },2200);
  }
  function homePos(){
    if(preset){
      S.cx=Math.round(preset.cx*W); S.cy=Math.round(preset.cy*H);
      S.rx=Math.round(preset.rx*W); S.ry=Math.round(preset.ry*H); S.rot=preset.rot||0;
      G.x1=preset.gx1*W; G.y1=preset.gy1*H; G.x2=preset.gx2*W; G.y2=preset.gy2*H;
      G.w=Math.round(preset.gw*W); autoTurns(); return;
    }
    S.cx=Math.round(W*0.5); S.cy=Math.round(H*0.173);
    S.ry=Math.round(H*0.146); S.rx=Math.round(Math.min(W*0.42,S.ry*0.832)); S.rot=0;
    G.x1=G.x2=Math.round(W*0.5); G.y1=Math.round(H*0.677); G.y2=Math.round(H*0.930);
    G.w=Math.round(W*0.080); autoTurns();
  }

  function strandV(x,y1,y2,col,lw,dp){
    ctx.lineCap='butt';
    if(dp>0){ ctx.strokeStyle=shade(col,-0.55); ctx.globalAlpha=0.75*dp; ctx.lineWidth=lw*1.5;
      ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2); ctx.stroke(); ctx.globalAlpha=1; }
    ctx.strokeStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2); ctx.stroke();
    if(dp>0){ ctx.strokeStyle=shade(col,0.75); ctx.globalAlpha=0.8*dp; ctx.lineWidth=Math.max(0.4,lw*0.28);
      ctx.beginPath(); ctx.moveTo(x-lw*0.24,y1); ctx.lineTo(x-lw*0.24,y2); ctx.stroke(); ctx.globalAlpha=1; }
  }
  function strandH(y,x1,x2,col,lw,dp){
    ctx.lineCap='butt';
    if(dp>0){ ctx.strokeStyle=shade(col,-0.55); ctx.globalAlpha=0.75*dp; ctx.lineWidth=lw*1.5;
      ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke(); ctx.globalAlpha=1; }
    ctx.strokeStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
    if(dp>0){ ctx.strokeStyle=shade(col,0.75); ctx.globalAlpha=0.8*dp; ctx.lineWidth=Math.max(0.4,lw*0.28);
      ctx.beginPath(); ctx.moveTo(x1,y-lw*0.24); ctx.lineTo(x2,y-lw*0.24); ctx.stroke(); ctx.globalAlpha=1; }
  }

  function drawStrings(){
    if(!S.on) return;
    var kk=k(), lw=Math.max(0.7,S.w*kk), dp=S.depth/100, sh=S.shadow/100, xs=[],ys=[],i,j;
    for(i=0;i<S.mainN;i++) xs.push(-S.rx+2*S.rx*(i+0.5)/S.mainN);
    for(j=0;j<S.crossN;j++) ys.push(-S.ry+2*S.ry*(j+0.5)/S.crossN);
    ctx.save();
    ctx.translate(S.cx,S.cy); ctx.rotate(S.rot*Math.PI/180);
    ctx.beginPath(); ctx.ellipse(0,0,S.rx,S.ry,0,0,Math.PI*2); ctx.clip();
    if(S.fade>0){ ctx.fillStyle='rgba(255,255,255,'+(S.fade/100)+')'; ctx.fillRect(-S.rx,-S.ry,S.rx*2,S.ry*2); }
    ctx.globalAlpha=S.alpha/100;
    if(sh>0){
      ctx.save(); ctx.translate(lw*1.1,lw*1.9);
      ctx.strokeStyle='rgba(0,0,0,'+(0.28*sh)+')'; ctx.lineWidth=lw*1.15;
      for(i=0;i<xs.length;i++){ ctx.beginPath(); ctx.moveTo(xs[i],-S.ry); ctx.lineTo(xs[i],S.ry); ctx.stroke(); }
      for(j=0;j<ys.length;j++){ ctx.beginPath(); ctx.moveTo(-S.rx,ys[j]); ctx.lineTo(S.rx,ys[j]); ctx.stroke(); }
      ctx.restore();
    }
    var cc=S.split?S.cross:S.main;
    for(i=0;i<xs.length;i++) strandV(xs[i],-S.ry,S.ry,S.main,lw,dp);
    for(j=0;j<ys.length;j++) strandH(ys[j],-S.rx,S.rx,cc,lw,dp);
    if(S.weave){ var h=lw*1.05;
      for(i=0;i<xs.length;i++) for(j=0;j<ys.length;j++)
        if((i+j)%2===0) strandV(xs[i],ys[j]-h,ys[j]+h,S.main,lw,dp); }
    ctx.globalAlpha=1; ctx.restore();
  }

  var gtmp=document.createElement('canvas'), gtx=gtmp.getContext('2d');
  function noise(x,y){ var n=Math.sin(x*12.9898+y*78.233)*43758.5453; return n-Math.floor(n); }

  function drawGrip(){
    if(!G.on||!img) return;
    var dx=G.x2-G.x1, dy=G.y2-G.y1, L=Math.hypot(dx,dy);
    if(L<12||G.w<6) return;
    var ang=Math.atan2(dy,dx)-Math.PI/2;
    var b=G.w/2, a=b*(G.taper/100), tz=G.tlen/100;
    var fl=b*(G.flare/100), fz=0.04+(G.flare/100)*0.2;
    var cl=b*0.45, endW=b+fl;
    var capTop=endW, capBot=b*0.78;
    var sdw=Math.max(1.5,b*0.16), sd=G.sd/100;
    var pad=Math.ceil(sdw+2), maxR=Math.max(endW,capTop)+1;
    var GW=Math.ceil(2*(maxR+pad)), GH=Math.ceil(L+cl+pad*2+sdw);
    if(gtmp.width!==GW) gtmp.width=GW;
    if(gtmp.height!==GH) gtmp.height=GH;
    var id=gtx.createImageData(GW,GH), D=id.data;
    var cx=GW/2, top=pad, p=L/Math.max(3,G.turns), TWO=Math.PI*2, LP=-0.5;
    var rel=G.rel/100, hexm=G.hex/100, FW=Math.PI/4;
    var c1=hx(G.color), c2=hx(G.color2);
    var cell=Math.max(4,b*0.34), texMode=G.tex;
    for(var py=0;py<GH;py++){
      var yy=py-top; if(yy<-sdw) continue;
      var r=0, capT=0, inCap=false, beyond=false;
      if(yy<0){ r=a; }
      else if(yy<=L){
        var u=yy/L;
        if(u<tz){ var ee=u/tz; r=a+(b-a)*(ee*ee*(3-2*ee)); }
        else if(u>1-fz) r=b+fl*((u-(1-fz))/fz);
        else r=b;
      } else {
        inCap=true; capT=(yy-L)/cl;
        if(capT>1){ beyond=true; r=0; }
        else r=capTop+(capBot-capTop)*capT;
      }
      for(var px=0;px<GW;px++){
        var x=px-cx, ax=x<0?-x:x, i4=(py*GW+px)<<2;
        var cov=(yy<0||beyond)?-9:(r-ax+0.5);
        if(cov<=0){
          if(sd<=0) continue;
          var dist=beyond?Math.sqrt(ax*ax+(capT-1)*(capT-1)*cl*cl):(yy<0?9e9:ax-r);
          if(dist>=sdw||dist<0) continue;
          var sa=0.34*sd*Math.pow(1-dist/sdw,1.6)*(x>0?1:0.6);
          D[i4]=0; D[i4+1]=0; D[i4+2]=0; D[i4+3]=sa*255;
          continue;
        }
        if(cov>1) cov=1;
        var s=x/r; if(s>1)s=1; if(s<-1)s=-1;
        var phi=Math.asin(s);
        var fc=Math.round(phi/FW)*FW;
        var nl=Math.cos(phi-LP)*(1-hexm)+Math.cos(fc-LP)*hexm;
        if(nl<0) nl=0;
        var lit=0.72+0.30*Math.pow(nl,0.85);
        var e=Math.abs(phi-fc)/(FW/2);
        if(e>0.72) lit*=1-0.13*hexm*((e-0.72)/0.28);
        var spec=Math.pow(nl,9)*0.09*rel, base=c1, f, sp=spec*255;
        if(inCap){
          var cf=r/capTop;
          f=lit*(0.86+0.14*cf)*(1-0.24*Math.pow(capT,2.4));
          if(capT<0.08) f*=1-0.18*(1-capT/0.08);
          sp*=cf*0.8;
        }else{
          var t=yy-G.dir*(p/TWO)*phi;
          var n=Math.floor(t/p), ph=t/p-n;
          if(G.stripe&&(n&1)) base=c2;
          var gd=ph<0.5?ph:1-ph;
          var groove=Math.exp(-(gd*gd)/0.0022);
          var ridge=Math.exp(-((ph-0.16)*(ph-0.16))/0.0075);
          var bump=Math.sin(Math.PI*ph);
          var rf=(1-0.17*rel*groove)*(1+0.05*rel*ridge)*(0.975+0.035*rel*bump);
          var tm=1;
          if(texMode==='towel') tm=1+(noise(px*1.7,py*1.7)-0.5)*0.15*rel;
          else if(texMode==='perf'){
            var gx=(px%cell)-cell/2, gy=(py%cell)-cell/2;
            if(gx*gx+gy*gy<cell*cell*0.035) tm=1-0.16*rel;
          } else tm=1+(noise(px,py)-0.5)*0.035;
          f=lit*rf*tm;
          if(yy<1.6) f*=0.80;
          sp*=0.5+0.5*bump;
        }
        var R=base[0]*f+sp, Gg=base[1]*f+sp, B=base[2]*f+sp;
        D[i4]=R>255?255:R<0?0:R;
        D[i4+1]=Gg>255?255:Gg<0?0:Gg;
        D[i4+2]=B>255?255:B<0?0:B;
        D[i4+3]=cov*255;
      }
    }
    gtx.putImageData(id,0,0);
    ctx.save(); ctx.translate(G.x1,G.y1); ctx.rotate(ang);
    ctx.drawImage(gtmp,-cx,-top); ctx.restore();
  }

  function drawLabels(){
    if(!G.on||!img||exporting) return;
    var dx=G.x2-G.x1, dy=G.y2-G.y1, L=Math.hypot(dx,dy);
    if(L<12||G.w<6) return;
    var ang=Math.atan2(dy,dx)-Math.PI/2, kk=k();
    var b=G.w/2, endW=b*(1+G.flare/100);
    var fz=0.04+(G.flare/100)*0.2, cl=b*0.45, fs=Math.max(11,13*kk);
    ctx.save(); ctx.translate(G.x1,G.y1); ctx.rotate(ang);
    ctx.font='600 '+fs+'px -apple-system,"Noto Sans TC",sans-serif';
    ctx.textBaseline='middle'; ctx.lineJoin='round';
    function band(y0,y1,half,fill,line,label,side){
      ctx.fillStyle=fill; ctx.fillRect(-half,y0,half*2,y1-y0);
      ctx.strokeStyle=line; ctx.lineWidth=Math.max(1,1.4*kk);
      ctx.strokeRect(-half,y0,half*2,y1-y0);
      var y=(y0+y1)/2, lx=side>0?half:-half, ext=Math.max(20,30*kk)*side;
      ctx.beginPath(); ctx.moveTo(lx,y); ctx.lineTo(lx+ext,y); ctx.stroke();
      ctx.textAlign=side>0?'left':'right';
      ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=Math.max(2.5,4*kk);
      ctx.strokeText(label,lx+ext+side*4,y);
      ctx.fillStyle=line; ctx.fillText(label,lx+ext+side*4,y);
    }
    band(L*0.45,L*(1-fz),b,'rgba(61,127,245,0.30)','#3d7ff5','① 握把寬度 '+Math.round(G.w),1);
    band(L*(1-fz),L+cl,endW,'rgba(224,64,60,0.34)','#e0403c','② 底蓋凸起 '+Math.round(G.flare),-1);
    ctx.restore();
  }

  function drawGuides(){
    if(exporting||(!hover&&!drag)) return;
    var kk=k();
    if(tab==='string'){
      ctx.save(); ctx.translate(S.cx,S.cy); ctx.rotate(S.rot*Math.PI/180);
      ctx.setLineDash([9,8]); ctx.lineWidth=Math.max(1,1.6*kk); ctx.strokeStyle='rgba(61,127,245,0.9)';
      ctx.beginPath(); ctx.ellipse(0,0,S.rx,S.ry,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }else{
      ctx.save(); ctx.setLineDash([7,7]); ctx.lineWidth=Math.max(1,1.4*kk);
      ctx.strokeStyle='rgba(61,127,245,0.8)';
      ctx.beginPath(); ctx.moveTo(G.x1,G.y1); ctx.lineTo(G.x2,G.y2); ctx.stroke();
      ctx.setLineDash([]);
      [[G.x1,G.y1],[G.x2,G.y2]].forEach(function(pt){
        ctx.beginPath(); ctx.arc(pt[0],pt[1],8*kk,0,6.29);
        ctx.fillStyle='rgba(61,127,245,0.85)'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=2*kk; ctx.stroke(); });
      ctx.restore();
    }
  }

  function render(){
    if(!img) return;
    ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    ctx.clearRect(0,0,W,H); ctx.drawImage(img,0,0,W,H);
    drawStrings(); drawGrip(); if(tab==='grip'&&G.labels) drawLabels(); drawGuides();
    snap();
  }

  function loadFile(f){
    if(!f||!/^image\//.test(f.type)) return;
    var r=new FileReader();
    r.onerror=function(){ alert('這個檔案讀不進來，請換一張試試。'); };
    r.onload=function(e){ var im=new Image();
      im.onerror=function(){
        alert('瀏覽器無法解析這張圖片。\n如果是 iPhone 拍的 HEIC 檔，請到「設定 → 相機 → 格式」改成「相容性最佳」，或先轉存成 JPG。');
      };
      im.onload=function(){
      img=im;
      var s=Math.min(1,1500/Math.max(im.width,im.height));
      W=Math.round(im.width*s); H=Math.round(im.height*s);
      cv.width=W; cv.height=H; g('vhint').hidden=false; resetView();
      ['sCx','nCx','sRx','nRx'].forEach(function(i){ g(i).max=W; });
      ['sCy','nCy','sRy','nRy'].forEach(function(i){ g(i).max=H; });
      var mw=Math.round(W*0.4); g('gW').max=mw; g('nGW').max=mw;
      homePos();
      g('stat').textContent='圖片 '+W+' × '+H;
      drop.hidden=true; cv.hidden=false;
      g('pick2').hidden=g('save').hidden=g('reset').hidden=g('home').hidden=g('undo').hidden=g('redo').hidden=g('savep').hidden=g('clrp').hidden=g('fit').hidden=false;
      syncUI(); render(); resetHist();
      }; im.src=e.target.result; };
    r.readAsDataURL(f);
  }

  function setTab(t){ tab=t;
    g('tabString').classList.toggle('on',t==='string'); g('tabGrip').classList.toggle('on',t==='grip');
    g('panelString').hidden=(t!=='string'); g('panelGrip').hidden=(t!=='grip');
    cv.style.cursor='move'; render(); }
  g('tabString').onclick=function(){ setTab('string'); };
  g('tabGrip').onclick=function(){ setTab('grip'); };


  var view={z:1,x:0,y:0};
  function applyView(){ cv.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.z+')'; }
  function resetView(){ view.z=1; view.x=0; view.y=0; applyView(); }
  function zoomAt(fx,fy,k){
    var z2=Math.max(1,Math.min(8,view.z*k));
    k=z2/view.z; if(k===1) return;
    var r=cv.getBoundingClientRect(), cx0=r.left+r.width/2, cy0=r.top+r.height/2;
    view.x-=(fx-cx0)*(k-1); view.y-=(fy-cy0)*(k-1); view.z=z2;
    if(view.z===1){ view.x=0; view.y=0; }
    applyView();
  }
  cv.addEventListener('wheel',function(e){
    if(!img) return; e.preventDefault();
    zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0018));
  },{passive:false});
  cv.addEventListener('dblclick',function(){ resetView(); });

  var ptrs={},pinch=null;
  function ptrCount(){ var n=0,x; for(x in ptrs) n++; return n; }
  function pinchStart(){
    var a=[],x; for(x in ptrs) a.push(ptrs[x]);
    pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),
           mx:(a[0].x+a[1].x)/2, my:(a[0].y+a[1].y)/2};
    drag=null;
  }

  var holdT=null;
  function touchHold(){
    hover=true; clearTimeout(holdT);
    holdT=setTimeout(function(){ hover=false; render(); },2500);
  }
  function pos(e){ var r=cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
  cv.addEventListener('pointerenter',function(){ hover=true; render(); });
  cv.addEventListener('pointerleave',function(){ hover=false; render(); });
  cv.addEventListener('pointerdown',function(e){
    if(!img) return; cv.setPointerCapture(e.pointerId); hover=true;
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    if(ptrCount()>=2){ pinchStart(); return; }
    var p=pos(e); last=p;
    if(tab==='grip'){
      var t=22*k();
      if(Math.hypot(p.x-G.x1,p.y-G.y1)<t) drag='g1';
      else if(Math.hypot(p.x-G.x2,p.y-G.y2)<t) drag='g2';
      else drag='gall';
    } else drag='ell';
    render();
  });
  cv.addEventListener('pointermove',function(e){
    if(ptrs[e.pointerId]) ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    if(pinch&&ptrCount()>=2){
      var a=[],q; for(q in ptrs) a.push(ptrs[q]);
      var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      var mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
      view.x+=mx-pinch.mx; view.y+=my-pinch.my;
      applyView();
      if(pinch.d>0) zoomAt(mx,my,d/pinch.d);
      pinch={d:d,mx:mx,my:my};
      return;
    }
    if(!drag||!img) return;
    var p=pos(e), dx=p.x-last.x, dy=p.y-last.y; last=p;
    if(drag==='ell'){ S.cx+=dx; S.cy+=dy; }
    else if(drag==='g1'){ G.x1=p.x; G.y1=p.y; autoTurns(); }
    else if(drag==='g2'){ G.x2=p.x; G.y2=p.y; autoTurns(); }
    else { G.x1+=dx; G.y1+=dy; G.x2+=dx; G.y2+=dy; }
    syncAll(); render();
  });
  function up(e){
    if(e&&e.pointerId!==undefined) delete ptrs[e.pointerId];
    if(ptrCount()<2) pinch=null;
    drag=null;
    if(e&&e.pointerType&&e.pointerType!=='mouse'){ touchHold(); }
    render();
  }
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

  g('pick').onclick=g('pick2').onclick=function(){ file.click(); };
  file.addEventListener('change',function(){ if(this.files[0]) loadFile(this.files[0]); this.value=''; });
  ['dragenter','dragover'].forEach(function(t){ stage.addEventListener(t,function(e){ e.preventDefault(); }); });
  stage.addEventListener('drop',function(e){ e.preventDefault(); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });


  g('home').onclick=function(){ homePos(); syncAll(); render(); };
  g('fit').onclick=resetView;
  g('savep').onclick=savePreset;
  g('clrp').onclick=clearPreset;
  g('undo').onclick=function(){ if(hi>0){ hi--; applyState(hist[hi]); } };
  g('redo').onclick=function(){ if(hi<hist.length-1){ hi++; applyState(hist[hi]); } };
  g('save').onclick=function(){
    exporting=true; render();
    var url=cv.toDataURL('image/png'); exporting=false; render();
    var a=document.createElement('a'); a.href=url; a.download='racket-'+Date.now()+'.png'; a.click();
  };
  g('reset').onclick=function(){
    S.fade=35; S.mainN=22; S.crossN=22; S.w=2.4; S.depth=70; S.shadow=30; S.alpha=100;
    S.split=false; S.main=S.cross='#ff2f6d';
    G.dir=1; G.stripe=false; G.color='#ff5fa2'; G.color2='#ffffff'; G.tex='pu';
    G.rel=120; G.hex=60; G.flare=38; G.sd=100; G.taper=78; G.tlen=9; G.turns=12; G.autoT=false;
    g('sSplit').checked=false; g('crossWrap').hidden=true;
    g('gStripe').checked=false; g('stripeWrap').hidden=true; g('gTex').value='pu';
    syncUI(); render();
  };

  loadCfg(); loadPreset(); syncUI();
})();
</script>
</body>
</html>
